<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./qr-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="QR: Zero-persistence, 100% client-side dual-action QR generator and scanner. Native UPI, WhatsApp, ServiceNow, Maps transit & print-ready standees." />
    <link rel="manifest" href="./manifest.json" />
    <title>QR</title>
    <script>
      // Ensure root domain access (https://injest.in/) redirects to the /qr/ base path
      if (window.location.pathname === '/' || window.location.pathname === '') {
        window.location.replace('/qr/#/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
